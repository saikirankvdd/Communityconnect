server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: communityconnect-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:communityconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: c3VwZXItc2VjdXJlLXJhbmRvbS1zZWNyZXQta2V5LWZvci1jb21tdW5pdHljb25uZWN0LXBsdXMtZXh0cmEtcGFkZGluZy1mb3ItMjU2LWJpdHM=
  expiration: 86400000 # 24 hours in ms
  cookie-name: cc_jwt_token

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

enable-h2-console: ${ENABLE_H2_CONSOLE:false}

logging:
  level:
    root: INFO
    com.communityconnect: DEBUG

